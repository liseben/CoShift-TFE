<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignore le manifeste pour l'icone de l'ecran d'accueil et ne lit
         que celle-ci. Sans elle, il fabrique une vignette de la page. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- `viewport-fit=cover` etend la page sous l'encoche et la barre du bas
         en mode installe ; les marges de securite sont reprises en CSS par
         env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>CoShift — Covoiturage d'entreprise</title>
    <meta
      name="description"
      content="CoShift organise le covoiturage au sein des entreprises, universités et événements : publiez vos trajets, réservez ceux de vos collègues, suivez vos réservations."
    />
    <!-- Couleur de la barre systeme en mode installe. Deux valeurs, pour que
         la barre suive la preference du systeme des le premier rendu ; le
         contexte de theme la reecrit ensuite selon le choix explicite. -->
    <meta name="theme-color" content="#F7F9FC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F1620" media="(prefers-color-scheme: dark)" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CoShift" />
    <meta property="og:title" content="CoShift — Covoiturage d'entreprise" />
    <meta
      property="og:description"
      content="Publiez vos trajets, réservez ceux de vos collègues, suivez vos réservations."
    />
    <meta name="twitter:card" content="summary" />

    <!--
      Résolution du thème AVANT le premier rendu.

      Ce script doit rester en ligne et bloquant : s'il était chargé en
      module différé, la page s'afficherait d'abord en clair puis
      basculerait, produisant un flash blanc désagréable — et aveuglant
      pour quelqu'un qui a justement choisi le mode sombre.

      Il écrit toujours une valeur explicite dans data-theme, y compris
      quand elle vient de la préférence système. Le CSS n'a ainsi qu'un
      seul bloc sombre à maintenir.
    -->
    <script>
      (function () {
        try {
          var choix = localStorage.getItem("coshift_theme");
          var theme =
            choix === "light" || choix === "dark"
              ? choix
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          // Stockage indisponible (navigation privée stricte) : on reste en clair.
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
