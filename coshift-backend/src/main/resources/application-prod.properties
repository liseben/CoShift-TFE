# =============================================================================
#  Profil « prod » — durcissement pour une mise en ligne
# =============================================================================
#  Activer avec : --spring.profiles.active=prod   (ou SPRING_PROFILES_ACTIVE=prod)
#
#  Ce fichier ne contient aucun secret : les identifiants restent dans le .env
#  du serveur, jamais dans le dépôt.
# =============================================================================

# --- DOCUMENTATION DE L'API ---
# Swagger UI et la spécification sont coupés en production. Ils décrivent
# l'intégralité de la surface d'attaque — chaque route, chaque paramètre, chaque
# champ attendu — et dispensent un attaquant de toute phase de reconnaissance.
# La classe OpenApiConfig est de son côté annotée @Profile("!prod") : même si
# ces deux propriétés étaient réactivées par erreur, la spécification ne serait
# plus alimentée.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# --- CORS ---
# À remplacer par le domaine réel au moment du déploiement. La valeur ci-dessous
# n'autorise volontairement aucune origine de développement.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://coshift.be}

# --- JOURNALISATION ---
# Les requêtes SQL ne doivent pas partir dans les journaux de production : elles
# contiennent des valeurs de paramètres, donc des données personnelles, et
# gonflent les fichiers jusqu'à saturer le disque.
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=WARN

# --- SUPERVISION ---
# Seuls les indicateurs nécessaires au suivi sont exposés ; « health » reste
# volontairement peu détaillé pour un appelant anonyme.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
