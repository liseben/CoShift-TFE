# =============================================================================
#  Messages du serveur — français (langue de référence)
# =============================================================================
#  Toute clé présente ici doit exister dans messages_en.properties. L'absence
#  ne se voit pas à la compilation — un fichier de propriétés n'est pas typé —
#  mais un test compare les deux jeux de clés.
#
#  Les paramètres numérotés {0}, {1} sont substitués à l'exécution. Leur ordre
#  peut différer d'une langue à l'autre : c'est précisément ce que la
#  numérotation permet.
#
#  L'encodage est UTF-8, déclaré dans MessagesConfig. Sans cette déclaration,
#  Spring lit ces fichiers en ISO-8859-1 et chaque accent devient un caractère
#  de remplacement.
# =============================================================================

