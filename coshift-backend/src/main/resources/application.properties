spring.application.name=coshift-backend

# --- IMPORT DU FICHIER .ENV ---
# Permet à Spring Boot de lire ton fichier .env à la racine
spring.config.import=optional:file:.env

# --- SERVEUR ---
# Port surchargeable via SERVER_PORT dans le .env : sur certains postes le 8080
# est déjà occupé (console web PEM de PostgreSQL, Tomcat, etc.).
server.port=${SERVER_PORT:8080}

# --- BASE DE DONNÉES (WAMP / MySQL) ---
# Connexion locale standard de WAMP sur le port 3306.
# Surchargeable via DB_URL pour pointer une autre instance sans toucher au code.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/coshift_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- FLYWAY pour les migrations ---
# Flyway est désormais la seule autorité sur le schéma : V1__Baseline_schema.sql
# reconstruit toute la base à partir de zéro.
spring.flyway.enabled=true
# Volontairement désactivé : sur une base non vide et sans historique, Flyway se
# baselinerait silencieusement en sautant les migrations. On préfère une erreur
# franche, qui signale que la base n'est pas dans l'état attendu.
spring.flyway.baseline-on-migrate=false

# --- JPA / HIBERNATE ---
# `validate` et non `update` : Hibernate vérifie que les entités correspondent
# au schéma produit par Flyway, mais ne le modifie plus jamais de lui-même.
# C'est ce qui garantit que le dépôt reste la source de vérité du schéma.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Dialecte MySQL pour que Hibernate génère les bonnes requêtes
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- SÉCURITÉ (Temporaire pour le dév) ---
spring.security.user.name=admin
spring.security.user.password=admin123

# --- JWT ---
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=${JWT_EXPIRATION}

# --- API EXTERNES ---
api.gnews.key=${GNEWS_API_KEY}
api.newsdata.key=${NEWSDATA_API_KEY}

# Active le pool de threads pour les tâches planifiées
spring.task.scheduling.pool.size=2

# Configuration Google OAuth2
api.google.client-id=415112384949-i0jihhuatgp8hrnuvptqujenhmmn0kb1.apps.googleusercontent.com

# --- FICHIERS UPLOADÉS ---
app.upload.dir=uploads/avatars
# Sert à construire les URL publiques des photos de profil : doit suivre server.port.
app.base-url=${APP_BASE_URL:http://localhost:${server.port}}

# --- EMAIL (Gmail SMTP) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000