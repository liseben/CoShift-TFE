spring.application.name=coshift-backend

# --- IMPORT DU FICHIER .ENV ---
# Permet à Spring Boot de lire ton fichier .env à la racine
spring.config.import=optional:file:.env

# --- SERVEUR ---
# Port surchargeable via SERVER_PORT dans le .env : sur certains postes le 8080
# est déjà occupé (console web PEM de PostgreSQL, Tomcat, etc.).
server.port=${SERVER_PORT:8080}

# --- BASE DE DONNÉES (WAMP / MySQL) ---
# Connexion locale standard de WAMP sur le port 3306.
# Surchargeable via DB_URL pour pointer une autre instance sans toucher au code.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/coshift_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- FLYWAY pour les migrations ---
# Flyway est désormais la seule autorité sur le schéma : V1__Baseline_schema.sql
# reconstruit toute la base à partir de zéro.
spring.flyway.enabled=true
# Volontairement désactivé : sur une base non vide et sans historique, Flyway se
# baselinerait silencieusement en sautant les migrations. On préfère une erreur
# franche, qui signale que la base n'est pas dans l'état attendu.
spring.flyway.baseline-on-migrate=false

# --- JPA / HIBERNATE ---
# `validate` et non `update` : Hibernate vérifie que les entités correspondent
# au schéma produit par Flyway, mais ne le modifie plus jamais de lui-même.
# C'est ce qui garantit que le dépôt reste la source de vérité du schéma.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Dialecte MySQL pour que Hibernate génère les bonnes requêtes
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- SÉCURITÉ ---
# L'utilisateur par défaut de Spring Boot (spring.security.user.*) a été retiré :
# il n'était de toute façon jamais créé, puisque ApplicationConfig déclare son
# propre UserDetailsService adossé à la table users. Il ne restait donc qu'un
# mot de passe en clair dans un fichier versionné.

# --- DOCUMENTATION DE L'API (springdoc / OpenAPI 3.1) ---
# Version publiée de l'API, distincte de celle de l'artefact Maven : le contrat
# exposé aux clients ne change pas au même rythme que le code qui l'implémente.
app.api.version=1.0.0
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Endpoints regroupés par tag et triés : sans cela l'ordre dépend de celui du
# scan des contrôleurs, qui n'est pas stable d'un démarrage à l'autre.
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.doc-expansion=none
# Le bouton « Try it out » n'a de sens que si l'appel part réellement.
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.writer-with-order-by-keys=true

# --- SUPERVISION (Actuator) ---
# Détail complet en développement : c'est précisément ce qu'on veut lire quand
# la sonde passe au rouge. Le profil « prod » le restreint aux appelants
# authentifiés, l'état de l'infrastructure n'ayant pas à être public.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# --- REFERENCEMENT ---
# Domaine public du site, distinct de celui de l'API : le plan du site ne peut
# declarer que des adresses du site lui-meme.
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:5173}

# --- CORS ---
# Origines autorisées à appeler l'API, en une seule liste faisant autorité.
# Elles étaient auparavant écrites en dur dans SecurityConfiguration, et les
# annotations @CrossOrigin des contrôleurs référençaient une propriété
# `app.cors.allowed-origins` qui n'existait pas : toutes retombaient donc sur
# leur valeur par défaut « * ». À surcharger via CORS_ALLOWED_ORIGINS lors d'une
# mise en ligne. Pas de « * » possible ici : les requêtes portent un en-tête
# Authorization, et allowCredentials interdit le joker.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# --- JWT ---
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=${JWT_EXPIRATION}

# --- API EXTERNES ---
api.gnews.key=${GNEWS_API_KEY}
api.newsdata.key=${NEWSDATA_API_KEY}

# Active le pool de threads pour les tâches planifiées
spring.task.scheduling.pool.size=2

# Configuration Google OAuth2
api.google.client-id=415112384949-i0jihhuatgp8hrnuvptqujenhmmn0kb1.apps.googleusercontent.com

# --- FICHIERS UPLOADÉS ---
app.upload.dir=uploads/avatars
# Sert à construire les URL publiques des photos de profil : doit suivre server.port.
app.base-url=${APP_BASE_URL:http://localhost:${server.port}}

# --- EMAIL (Gmail SMTP) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000