# =============================================================================
#  Profil de test — activé par @ActiveProfiles("test")
# =============================================================================
#  Les tests ne passent pas par CoshiftBackendApplication.main(), qui est le
#  seul endroit où le fichier .env est chargé (via java-dotenv). Tous les
#  placeholders ${DB_USERNAME}, ${JWT_SECRET_KEY}, ${MAIL_USERNAME}... restaient
#  donc littéraux et le contexte Spring échouait au démarrage.
#
#  Ce fichier redéfinit chacune de ces propriétés avec des valeurs de test :
#  Spring retient la valeur du profil actif et ne cherche jamais à résoudre le
#  placeholder d'origine.
# =============================================================================

# --- BASE DE DONNÉES : H2 en mémoire ---
# Recréée à chaque exécution, aucune dépendance à WAMP ni à MySQL.
spring.datasource.url=jdbc:h2:mem:coshift_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- FLYWAY : désactivé en test ---
# V1__Baseline_schema.sql est écrit en SQL MySQL (ENGINE=InnoDB, ENUM, BIT(1))
# et n'est pas portable sur H2. Le schéma de test est donc dérivé directement
# des entités JPA. La fidélité du baseline reste vérifiée au démarrage réel,
# où ddl-auto=validate compare les entités au schéma produit par Flyway.
spring.flyway.enabled=false

# --- HIBERNATE ---
# create-drop et non validate : c'est Hibernate qui construit le schéma de test.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# create-drop commence par supprimer les tables : sur une base vierge, chaque
# DROP échoue et Hibernate journalise une stacktrace « Table non trouvée ».
# Ce bruit est attendu et sans conséquence — on l'éteint pour que l'échec d'un
# vrai test reste visible dans la sortie.
logging.level.org.hibernate.tool.schema.internal.ExceptionHandlerLoggedImpl=OFF

# --- JWT ---
# Clé factice encodée en Base64 (256 bits), valable uniquement pour les tests.
application.security.jwt.secret-key=dGVzdC1zZWNyZXQta2V5LWNvc2hpZnQtdW5pdC10ZXN0cy0yNTY=
application.security.jwt.expiration=3600000

# --- API EXTERNES ---
# Clés factices : aucun appel réseau ne doit partir depuis les tests.
api.gnews.key=test-key
api.newsdata.key=test-key
api.google.client-id=test-client-id.apps.googleusercontent.com

# --- PLANIFICATEUR ---
# Le flux d'actualités se déclenche normalement 5 s après le démarrage, donc en
# plein milieu de la suite. On repousse la première exécution à 1 h : elle
# n'arrive jamais pendant les tests.
app.news.initial-delay=3600000
app.news.fixed-rate=3600000

# --- EMAIL ---
# Serveur inexistant : EmailService étant @Async et journalisant ses erreurs,
# un échec d'envoi ne fait pas tomber le test.
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@coshift.be
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

# --- FICHIERS UPLOADÉS ---
app.upload.dir=target/test-uploads/avatars
app.base-url=http://localhost:8080
