# Intégration continue.
#
# Le projet a longtemps vécu sans : rien ne vérifiait qu'un commit compilait,
# et un refactor a pu rester cassé plusieurs jours sans que rien ne le signale.
# Ce fichier ferme cette porte — chaque envoi et chaque pull request relance la
# compilation des deux modules et la suite de tests.
#
# Aucune base de données n'est nécessaire : les tests backend s'exécutent sur
# H2 en mémoire, et les tests unitaires des services ne démarrent même pas de
# contexte Spring.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — compilation et tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Tests et couverture
        working-directory: coshift-backend
        run: ./mvnw -B --no-transfer-progress test

      # Le rapport est conservé pour être consultable depuis l'exécution, sans
      # avoir à rejouer la suite localement.
      - name: Publier le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-jacoco
          path: coshift-backend/target/site/jacoco/
          if-no-files-found: warn

  frontend:
    name: Frontend — compilation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: coshift-frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: coshift-frontend
        run: npm ci

      # Non bloquant à ce stade : l'analyse remonte encore des avertissements
      # hérités, et une CI rouge en permanence est une CI que plus personne ne
      # regarde. Le résultat reste lisible dans le journal, et l'étape passera
      # bloquante une fois la dette résorbée.
      - name: Analyse statique
        working-directory: coshift-frontend
        run: npm run lint
        continue-on-error: true

      - name: Compilation
        working-directory: coshift-frontend
        run: npm run build
